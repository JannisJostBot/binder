# Keeps the CI's GitHub Actions current (they're pinned to commits in .github/workflows; Dependabot updates the
# commit and the version comment together). Only the actions: the app has no NuGet packages to update this way
# besides the one approved in CLAUDE.md, which is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
