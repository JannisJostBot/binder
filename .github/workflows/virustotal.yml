name: VirusTotal

# Scans a release's setup with VirusTotal, decides whether it may be released (the release check) and adds both to
# the release notes (docs/proposals.md §25, "Making a release", step 4).
#
#  - After release.yml has made the draft: the scan the release depends on. sign-release.ps1 refuses to sign until
#    the draft's notes hold a "passed" check for the very file it verified; a "blocked" check fails this run and can
#    only be overridden with a reason (sign-release.ps1 -OverrideScan "…"), which goes into the published notes.
#  - When the release is published: a second scan, since engines change their minds. A "blocked" result then fails
#    the run and opens an issue: people may already have it, so look at it at once.
#  - By hand for a tag (Actions › VirusTotal › Run workflow): scan it again, e.g. after a vendor fixed a false
#    positive.
#
# The release check is blocked when any of the major engines below flags the setup (malicious or suspicious), or
# when 3 or more engines do, whichever they are (owner, 2026-11-18). Smaller heuristic engines often flag new
# unsigned installers, so one of those alone passes (0.2.1: Bkav alone).
#
# Kept apart from release.yml on purpose: release.yml builds and attests the setup and holds no secret; this job holds
# the VirusTotal key and nothing else. It checks out no code, builds nothing and uses no third-party actions: it
# downloads the setup from the release, checks its SHA-256 (against the signed release.json once published, before
# that against GitHub's own hash of the uploaded file), uploads it to VirusTotal
# (https://docs.virustotal.com/reference/overview), waits for the result and writes it between the markers below:
# the scan date, how many engines flagged it, the report link, the hash and the release check, but not which engines
# (one false positive named there reads worse than it is; the run's log and the report list them).
#
# Setup (owner, once): a free VirusTotal account's API key as the repository secret VT_API_KEY (Settings › Secrets
# and variables › Actions). The public API allows 4 requests a minute, so the job waits 30 s between checks.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan, e.g. v0.2.1'
        required: true

permissions:
  contents: write   # reading the draft, editing the release notes
  issues: write     # an issue when a published release's check is blocked

concurrency:
  group: virustotal-${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  scan:
    # After release.yml: only when it made the draft (a v* tag push that succeeded).
    if: >-
      github.repository == 'JannisJostBot/binder' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scan the setup and add the result to the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v((0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4}))$') { Write-Host "Not a release tag: $env:TAG"; exit 1 }
          $version = $Matches[1]
          if (-not $env:VT_API_KEY) { Write-Host '::error::The repository secret VT_API_KEY is missing (see the top of virustotal.yml).'; exit 1 }
          $setupName = "BinderSetup-$version.exe"

          # The engines whose finding alone blocks a release (VirusTotal's names), and how many engines of any kind do.
          $major = @('Microsoft', 'Kaspersky', 'ESET-NOD32', 'BitDefender', 'Sophos', 'Symantec', 'Avast', 'AVG',
              'Malwarebytes', 'TrendMicro', 'TrendMicro-HouseCall', 'McAfee', 'McAfeeD', 'CrowdStrike')
          $blockAt = 3

          # The release (a draft until the owner signs it): drafts are found through the list, not by tag.
          $release = gh api "repos/$env:REPO/releases?per_page=50" --jq ".[] | select(.tag_name == `"$env:TAG`") | tojson" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) { Write-Host "::error::No release $env:TAG"; exit 1 }
          $asset = @($release.assets) | Where-Object { $_.name -eq $setupName } | Select-Object -First 1
          if (-not $asset) { Write-Host "::error::$env:TAG has no $setupName"; exit 1 }
          $isDraft = [bool]$release.draft

          New-Item -ItemType Directory -Force rel | Out-Null
          $patterns = @('--pattern', $setupName)
          if (-not $isDraft) { $patterns += @('--pattern', 'release.json') }
          gh release download $env:TAG --repo $env:REPO --dir rel @patterns --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host "Couldn't download $setupName from $env:TAG"; exit 1 }
          $setup = Join-Path rel $setupName
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          # The file scanned must be the release's: GitHub's hash of the upload, and once published the signed manifest's.
          if ("$($asset.digest)" -match '^sha256:([0-9a-f]{64})$' -and $Matches[1] -ne $sha256) {
              Write-Host "::error::$setupName doesn't match GitHub's hash of the upload ($sha256 vs $($asset.digest))"; exit 1
          }
          if (-not $isDraft) {
              $manifest = Get-Content -Raw (Join-Path rel release.json) | ConvertFrom-Json
              if ("$($manifest.setup.sha256)".ToLowerInvariant() -ne $sha256) {
                  Write-Host "::error::$setupName doesn't match the SHA-256 in release.json ($sha256 vs $($manifest.setup.sha256))"; exit 1
              }
          }
          Write-Host "$setupName  SHA-256 $sha256  ($(if ($isDraft) { 'draft' } else { 'published, matches release.json' }))"

          # Upload (files over 32 MB need their own upload address) and wait for the analysis.
          $headers = @{ 'x-apikey' = $env:VT_API_KEY; 'accept' = 'application/json' }
          $uploadUrl = (Invoke-RestMethod -Headers $headers -Uri 'https://www.virustotal.com/api/v3/files/upload_url').data
          # curl for the upload: VirusTotal's upload server rejects PowerShell's -Form body ("Malformed multipart body").
          # The key goes in through a header file, so it isn't on the command line.
          $headerFile = Join-Path ([IO.Path]::GetTempPath()) 'vt-headers.txt'
          Set-Content -LiteralPath $headerFile -Value "x-apikey: $env:VT_API_KEY" -NoNewline
          $upload = curl --silent --show-error --fail-with-body --max-time 600 -H "@$headerFile" -F "file=@$setup" $uploadUrl
          $curlExit = $LASTEXITCODE
          Remove-Item -LiteralPath $headerFile
          if ($curlExit -ne 0) { Write-Host "::error::The upload to VirusTotal failed: $upload"; exit 1 }
          $analysisId = ($upload | ConvertFrom-Json).data.id
          Write-Host "Uploaded; analysis $analysisId"
          $analysis = $null
          for ($i = 0; $i -lt 70; $i++) {
              Start-Sleep -Seconds 30
              $analysis = (Invoke-RestMethod -Headers $headers -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId").data
              Write-Host "  $($analysis.attributes.status)"
              if ($analysis.attributes.status -eq 'completed') { break }
          }
          if ($analysis.attributes.status -ne 'completed') { Write-Host '::error::VirusTotal didn''t finish within 35 minutes; run the workflow again later.'; exit 1 }

          $stats = $analysis.attributes.stats
          $flagged = [int]$stats.malicious + [int]$stats.suspicious
          $engines = $flagged + [int]$stats.undetected + [int]$stats.harmless
          $hits = @($analysis.attributes.results.PSObject.Properties | Where-Object { $_.Value.category -in 'malicious', 'suspicious' })
          $names = @($hits | ForEach-Object { "$($_.Name) ($($_.Value.result))" })
          $majorHits = @($hits | Where-Object { $_.Name -in $major } | ForEach-Object Name)
          $report = "https://www.virustotal.com/gui/file/$sha256"
          $date = [DateTime]::UtcNow.ToString('yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture)
          Write-Host "$flagged of $engines engines flagged it. $report"
          if ($flagged -gt 0) { Write-Host "Flagged by: $($names -join ', ')" }

          # The release check: why it's blocked, in words for the notes (counts only, no engine names).
          $why = @()
          if ($majorHits) { $why += "$($majorHits.Count) of the major engines flagged it" }
          if ($flagged -ge $blockAt) { $why += "$flagged engines flagged it ($blockAt or more block a release)" }
          $passed = -not $why
          $check = if ($passed) { 'passed' } else { 'blocked' }
          $checkLine = if ($passed) {
              'Release check: passed (no major antivirus engine and fewer than 3 engines flagged it).'
          } else {
              "Release check: blocked, $($why -join ' and ')."
          }

          # The notes: this section replaces an earlier one between the same markers. The comment line is what
          # sign-release.ps1 reads: the check and the exact file it applies to.
          $section = @(
              '<!-- virustotal -->'
              '### VirusTotal'
              "``$setupName`` was scanned with VirusTotal on ${date}: $flagged of $engines engines flagged it. [Full report]($report)"
              ''
              "SHA-256 ``$sha256``$(if ($isDraft) { '.' } else { ', the same as in the signed ``release.json``.' })"
              ''
              $checkLine
              "<!-- release-check: $check sha256=$sha256 -->"
              '<!-- /virustotal -->'
          )
          $body = gh release view $env:TAG --repo $env:REPO --json body --jq .body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $body = (($body -join "`n") -replace '(?s)\s*<!-- virustotal -->.*?<!-- /virustotal -->', '').TrimEnd()
          $notes = if ($body) { $body + "`n`n" + ($section -join "`n") + "`n" } else { ($section -join "`n") + "`n" }
          Set-Content -LiteralPath notes.md -Value $notes -NoNewline -Encoding utf8NoBOM
          gh release edit $env:TAG --repo $env:REPO --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Couldn't edit the notes of $env:TAG"; exit 1 }
          Write-Host "Added the result to $env:TAG's notes."

          if ($passed) {
              if ($flagged -gt 0) { Write-Host "::warning::VirusTotal: $flagged of $engines engines flagged $setupName ($($names -join ', ')); below the release check's limits. $report" }
              exit 0
          }
          $detail = "$flagged of $engines engines flagged $setupName ($($names -join ', '))$(if ($majorHits) { "; major: $($majorHits -join ', ')" }). $report"
          if ($isDraft) {
              Write-Host "::error::Release check blocked: $detail. sign-release.ps1 won't sign $env:TAG. If it's a false positive: report it to the vendor and run this workflow again for $env:TAG later, or sign with -OverrideScan ""<reason>"" (the reason goes into the published notes)."
              exit 1
          }
          # Published already. When the owner signed it with -OverrideScan for this very file, the notes say so and why:
          # a warning then, not a new issue each time it's scanned.
          if ($body -match "<!-- release-check-override sha256=$sha256 -->") {
              Write-Host "::warning::Release check still blocked for $env:TAG (published with an override; see its notes): $detail"
              exit 0
          }
          # Otherwise say so where it's seen.
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $issueBody = "The VirusTotal scan of the published $env:TAG now fails the release check: $detail`n`n" +
              "People may already have this version. Check the report; if it's a false positive, report it to the vendors that " +
              "flagged it. Run: $runUrl`n`nOpened by the VirusTotal workflow."
          gh issue create --repo $env:REPO --title "VirusTotal: $env:TAG fails the release check" --body $issueBody
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::Couldn''t open an issue.' }
          Write-Host "::error::Release check blocked for the published $env:TAG`: $detail"
          exit 1
