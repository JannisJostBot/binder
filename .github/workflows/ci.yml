name: CI

# Builds and tests on a real Windows machine: compile, unit tests, then a UI smoke test that runs the
# widget, clicks through it and checks the launch -> hide -> return loop. Screenshots and metrics are
# uploaded as the "smoke-test" artifact, and (on pushes) also committed to the "ci-results/<branch>"
# branch, so they can be read with plain git by reviewers and agents that can't download artifacts.
#
# A branch that changes only the website (site/), Markdown files or the website's workflow skips the Windows job:
# the "website" job runs check.ps1 on Linux instead (the rules, and the unit tests, which read site/docs.html).
# Pushes to main and every other change get the full Windows run.

on:
  push:
    branches-ignore:
      - 'ci-results/**'
  pull_request:
  workflow_dispatch:

# Actions are pinned to the commit of a release (its version in the comment), so a moved tag can't change what
# runs here. Update both together.
permissions:
  contents: write   # only for pushing the ci-results/<branch> branch

# A newer push to the same branch replaces a run still going (its ci-results would be overwritten anyway), so the
# latest commit's result comes sooner. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether the app needs building: "false" only when every file the branch changes since it left main is the
  # website's (site/, a .md file, pages.yml). Anything else, main itself, or a diff it can't read: "true".
  changes:
    # A pull request from a branch of this repository already gets the push run on the same commit (shown on the
    # pull request too); only one from a fork runs here as a pull_request. The jobs below follow this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: files
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          app=true
          if [ "$BRANCH" != main ] && base=$(git merge-base HEAD origin/main) && files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ]; then
            echo "Changed since $base:"; echo "$files"
            if ! echo "$files" | grep -qvE '^site/|\.md$|^\.github/workflows/pages\.yml$'; then app=false; fi
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  # Website-only changes: the same rule check and unit tests as on Windows (check.ps1 skips the WinUI build on Linux).
  website:
    needs: changes
    if: needs.changes.outputs.app == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # check.ps1 compares with where the branch left origin/main
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Rule check and unit tests
        shell: pwsh
        run: ./scripts/check.ps1 -Base origin/main

  windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # check.ps1 compares with where the branch left origin/main
          # Every commit, but file contents only for the checked-out one (others are fetched when a diff needs them):
          # a full clone also downloads each ci-results/* branch's setup exe, ~800 MB and a minute in all.
          filter: blob:none

      # The project's hard rules (AGENTS.md). On agent/* branches also the strict rules and the task card's file
      # list; the card is found by the branch name (agent/T001 -> docs/tasks/T001-*.md). Build and tests run below.
      - name: Rule check
        shell: pwsh
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $checkArgs = @{ SkipBuild = $true; Base = 'origin/main' }
          if ($env:BRANCH -like 'agent/*') {
            $id = $env:BRANCH.Substring(6)
            $card = Get-ChildItem docs/tasks -Filter "$id-*.md" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $card) { Write-Host "No task card docs/tasks/$id-*.md for branch $env:BRANCH"; exit 1 }
            $checkArgs.Task = $card.FullName
          }
          ./scripts/check.ps1 @checkArgs

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # The debug panel (src/Binder/Dev) is only compiled in Debug builds, which nothing else here makes: build the
      # widget once in Debug too, so a change that breaks the panel fails here instead of on someone's PC.
      - name: Build (Debug, with the debug panel)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build src/Binder -c Debug 2>&1 | Tee-Object artifacts/build-debug.txt

      # Test what ships: the published WinUI widget folder and the Native AOT watcher (publish.ps1). This is also the
      # Release build: it compiles every project of Binder.sln in Release for win-x64 (a separate
      # "dotnet build Binder.sln -c Release" compiled the same code again, 80 s); compiler output is in publish.txt.
      - name: Publish
        run: |
          ./scripts/publish.ps1 -Output publish 2>&1 | Tee-Object artifacts/publish.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish -File | ForEach-Object { '{0}: {1:N0} KB' -f $_.Name, ($_.Length / 1KB) } |
            Tee-Object artifacts/publish-sizes.txt
          # The built installer, so a manual test on a real PC needs no build tools: download it from the
          # "smoke-test" artifact or the ci-results/<branch> branch.
          Copy-Item publish/BinderSetup.exe artifacts/

      - name: Unit tests
        run: dotnet run --project tests/Binder.Tests -c Release 2>&1 | Tee-Object artifacts/unit-tests.txt

      - name: Build stand-in game
        run: dotnet build tests/FakeGame -c Release

      - name: UI smoke test
        shell: powershell
        env:
          WATCHER_BUILD: Native AOT
        run: ./tests/smoke.ps1 -Exe publish/app/Binder.exe -FakeGame tests/FakeGame/out/FakeGame.exe

      # The website's numbers as the release workflow (site-numbers.yml) would write them, on a copy of the page:
      # catches a broken marker or a measurement the page would contradict before a release. The result is in
      # the artifacts (site-preview.html); it doesn't fail the run, since a busy test machine can be noisy.
      - name: Website numbers (preview)
        continue-on-error: true
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          Copy-Item site/index.html artifacts/site-preview.html
          ./scripts/site-numbers.ps1 -Numbers artifacts/site-numbers.json -Version $version -Site artifacts/site-preview.html

      # The Releases page as the Website workflow writes it (artifacts/releases-preview.html), from the published
      # releases; it doesn't fail the run (the list only changes when a release is published).
      - name: Releases page (preview)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | tojson' > artifacts/releases.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item site/releases.html artifacts/releases-preview.html
          ./scripts/site-releases.ps1 -Releases artifacts/releases.jsonl -Repository $env:GITHUB_REPOSITORY -Site artifacts/releases-preview.html

      # The installer: install through its dialogs, update while the app and a watcher run, uninstall.
      - name: Setup test
        if: always()
        shell: powershell
        run: ./tests/setup-test.ps1 -Setup publish/BinderSetup.exe -Published publish/app

      # Also prints the screenshots as base64 JPEGs into the log, for reviewers (and agents) that can read
      # the job log but not download artifacts.
      - name: Screenshots in log
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $params = New-Object System.Drawing.Imaging.EncoderParameters 1
          $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]75)
          Get-ChildItem artifacts -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $ms = New-Object System.IO.MemoryStream
            $img.Save($ms, $jpeg, $params)
            $img.Dispose()
            Write-Host "BEGIN-SCREENSHOT $($_.BaseName)"
            Write-Host ([Convert]::ToBase64String($ms.ToArray()))
            Write-Host "END-SCREENSHOT $($_.BaseName)"
          }

      - name: Upload screenshots and metrics
        if: always()
        # Only a convenience copy: a full storage quota mustn't fail the run.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test
          path: artifacts/
          if-no-files-found: ignore
          # The same files go to the ci-results branch below, so the artifact is only a convenience. GitHub keeps
          # artifacts 90 days by default; with a ~40 MB setup exe in every run that filled the storage quota.
          retention-days: 3

      # Readable without the Actions API: one commit with this run's screenshots, metrics and logs,
      # force-pushed so the branch never grows.
      - name: Publish results to ci-results branch
        if: always() && github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'ci-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item artifacts/* $out -Recurse -ErrorAction SilentlyContinue
          @(
            "# CI results for $env:BRANCH",
            "",
            "- Commit: $env:GITHUB_SHA",
            "- Run: $env:RUN_URL",
            "- Job status when published: $env:JOB_STATUS",
            "- Time (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))"
          ) | Set-Content (Join-Path $out 'README.md')
          Set-Location $out
          git init -q -b results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "CI results for $env:BRANCH at $env:GITHUB_SHA"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q -f `
            "https://github.com/$env:GITHUB_REPOSITORY.git" "results:refs/heads/ci-results/$env:BRANCH"

