name: Website

# Publishes site/ (index.html, docs.html, releases.html, styles.css, logo.svg, release.js, clock.js, story.js, game.js, nav.js,
# usage.js, download.js) to GitHub Pages: on every push to main that changes the site, when a release is published, edited or deleted, or by
# hand (Actions › Website › Run workflow). The files go up as they are (no Jekyll), except releases.html's list of versions,
# which scripts/site-releases.ps1 writes first from the published releases and docs/releases/*.json. If that step fails, the
# list committed in releases.html goes up unchanged. Address: https://jannisjostbot.github.io/binder/ (or a custom domain set in Settings › Pages).
#
# Setup (owner, once): Settings › Pages › Build and deployment › Source: "GitHub Actions".
#
# Actions are pinned to the commit of a release (its version in the comment), so a moved tag can't change what runs
# here. Update both together.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'docs/releases/**'
      - 'scripts/site-releases.ps1'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read    # reading site/ and the list of releases
  pages: write      # publishing
  id-token: write   # proving to Pages that this run is the one publishing

concurrency:
  group: pages
  cancel-in-progress: false   # let a deployment that started finish

jobs:
  deploy:
    if: github.repository == 'JannisJostBot/binder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Releases page's list: every published release (drafts aren't listed), with its notes. Only this step has
      # the run's token, read-only.
      - name: Release list
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'releases.jsonl'
          gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | tojson' > $list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/site-releases.ps1 -Releases $list -Repository $env:GITHUB_REPOSITORY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
